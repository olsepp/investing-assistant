services:
  postgres:
    image: postgres:18
    container_name: investing-postgres
    environment:
      POSTGRES_DB: investing
      POSTGRES_USER: investing
      POSTGRES_PASSWORD: investing   # local development only
    ports:
      - "127.0.0.1:5432:5432"        # reachable only from this computer
    volumes:
      - postgres-data:/var/lib/postgresql   # keeps data when the container is removed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investing -d investing"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
