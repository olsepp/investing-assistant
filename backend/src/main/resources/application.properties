spring.application.name=backend

# Database (matches docker-compose.yml in the project root)
spring.datasource.url=jdbc:postgresql://localhost:5432/investing
spring.datasource.username=investing
spring.datasource.password=investing

# Don't keep database sessions open while rendering HTTP responses (avoids hidden slow queries)
spring.jpa.open-in-view=false

# Show database status in /actuator/health
management.endpoint.health.show-details=always
